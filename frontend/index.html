    <!-- ── Structured Data: FAQ ──────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SSBCircle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A platform for anyone who wants to become an officer in the Indian Army, Navy or Air Force. It covers the whole journey: what you can become and how to join, the exam dates, AI feedback on your PIQ, TAT stories and spoken answers, a Prep Sheet of topics for GD and interview, and live practice with other aspirants."
          }
        },
        {
          "@type": "Question",
          "name": "I am new to all this. Where do I start?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Start with the \"How to become an officer\" guide. Then check which entries you are eligible for, note the exam dates, and fill your PIQ — most interview questions come from it. After that, practise a little every day."
          }
        },
        {
          "@type": "Question",
          "name": "How does the PIQ Analyzer help me in the SSB interview?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fill your Personal Information Questionnaire and our AI reads it the way an Interviewing Officer would, using the methods SSB mentors use. You get the questions you are likely to face, grouped the way an IO asks them, the points where you will be pressed, and a short practice plan. Download it as a PDF and keep it in front of you while you prepare."
          }
        },
        {
          "@type": "Question",
          "name": "How does TAT practice work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You see a TAT-style picture, write a story in four minutes, and get feedback on how it reads to an assessor — the hero, the action, the outcome and what it shows about you. If you have filled your PIQ, you also get ideas drawn from your own life, which you are free to use or ignore."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Prep Sheet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Over 100 topics in nine sections — yourself, the armed forces, defence, international relations, economy, polity, society, science and environment — made with SSB ex-assessors and recommended candidates. You do not need to be an expert: know the basics of each and have your own view. Answer each question out loud and get AI feedback; add your SSB date for a daily plan and revision."
          }
        },
        {
          "@type": "Question",
          "name": "Which entries can I apply for, and when are the exams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Enter your date of birth and education in the eligibility checker to see the officer entries open to you — NDA, CDS, AFCAT, TES, TGC, Navy entries and more. The exam calendar shows upcoming notifications, exam dates and results, and the ticker on the home page keeps you reminded."
          }
        },
        {
          "@type": "Question",
          "name": "Can I practise with other aspirants?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Join live voice rooms for Group Discussion, PPDT, Lecturette and mock interviews, or create your own and share the code. Aspirants meet every day at 10 PM and 11 PM IST. In the Community you can share your SSB experience, find others with the same SSB dates, and ask your doubts."
          }
        },
        {
          "@type": "Question",
          "name": "Why is AI feedback limited each day?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every AI check — a PIQ report, TAT feedback or a spoken answer — costs us real money to run. That is why there is a daily limit. Please use it when your answer is ready, not just to test; using it responsibly keeps it available for everyone."
          }
        },
        {
          "@type": "Question",
          "name": "Is my PIQ private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Only you can see your PIQ and your reports; they are never shown to other users. When you ask for a report, your answers are sent to our AI provider only to write that report."
          }
        }
      ]
    }
    </script>

      <div style="max-width:900px;margin:0 auto;padding:24px;font-family:sans-serif;color:#111;">
        <h1 style="font-size:2rem;font-weight:800;margin-bottom:8px;">SSBCircle — SSB Interview Preparation Platform</h1>
        <p style="font-size:1.1rem;color:#444;margin-bottom:24px;">Practice SSB GD, PPDT, Lecturette, IO mock interviews, share your SSB experience, and improve English speaking online — with real defence aspirants, for NDA, CDS, AFCAT and TA candidates.</p>

        <h2 style="font-size:1.4rem;font-weight:700;margin-top:32px;margin-bottom:8px;">Service Selection Board (SSB) Interview Prep Online</h2>
        <p style="color:#555;line-height:1.7;">SSBCircle is India's online platform for SSB interview preparation. Connect with defence aspirants from every state, join live voice rooms, and practice every stage of the SSB interview — from Day 1 PPDT screening to GD, Lecturette, and the personal IO interview — with a built-in timer, live speech-to-text transcript, and self-evaluation checklist.</p>

        <h2 style="font-size:1.3rem;font-weight:700;margin-top:28px;margin-bottom:8px;">What You Can Practice on SSBCircle</h2>
        <ul style="color:#555;line-height:2;padding-left:20px;">
          <li><strong>SSB GD (Group Discussion)</strong> — Live voice rooms with up to 8 participants, matching the real SSB GD group size, with GD timer and live transcript</li>
          <li><strong>PPDT (Picture Perception &amp; Discussion Test)</strong> — Simulate the Day 1 SSB screening test: narrate your story, then discuss in a group with real peers</li>
          <li><strong>Lecturette</strong> — Practice 3-minute individual talks in front of a live group to build speaking clarity and vocabulary</li>
          <li><strong>IO Mock Interview (Interview Officer)</strong> — Simulate the SSB personal interview, practice presenting your life experiences, and get peer feedback</li>
          <li><strong>SSB Experience Sharing</strong> — Connect with aspirants who have attended an SSB centre and learn from their firsthand experience</li>
          <li><strong>English Speaking &amp; Communication Skills</strong> — Every session builds fluency, reduces hesitation, and improves the spoken English that SSB evaluators look for</li>
          <li><strong>Scheduled Sessions</strong> — Book upcoming SSB practice sessions and get notified when they go live</li>
        </ul>

        <h2 style="font-size:1.3rem;font-weight:700;margin-top:28px;margin-bottom:8px;">Key Features</h2>
        <ul style="color:#555;line-height:2;padding-left:20px;">
          <li>Real-time speech-to-text transcript for post-session review</li>
          <li>GD timer to practice structured SSB-format discussions</li>
          <li>Self-evaluation checklist aligned with SSB GTO criteria</li>
          <li>Works on any browser — no download needed</li>
          <li>Open to all NDA, CDS, AFCAT, TES, UES &amp; TA aspirants</li>
        </ul>

        <h2 style="font-size:1.3rem;font-weight:700;margin-top:28px;margin-bottom:8px;">Who is SSBCircle for?</h2>
        <p style="color:#555;line-height:1.7;">SSBCircle is for every Indian defence aspirant preparing for the Service Selection Board — NDA, CDS, AFCAT, TA, TES, UES, or any other entry scheme. Whether you need to clear the PPDT screening, ace the GD round, deliver a strong Lecturette, or prepare for the IO personal interview, SSBCircle gives you a structured way to practice with real peers.</p>
